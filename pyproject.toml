[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roteamento-llm"
version = "0.1.0"
description = "CLI inteligente de roteamento de modelos LLM com orquestrador de baixo custo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "litellm>=1.40.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rllm = "roteamento.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["roteamento"]

[tool.ruff]
line-length = 100
target-version = "py310"
